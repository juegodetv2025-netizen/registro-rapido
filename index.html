<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro rápido de día laborado · LICONSUMAR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230c1930'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f5a524'%3E🚚%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root{
  --navy:#0c1930;
  --navy-2:#070f1f;
  --navy-soft:#16283f;
  --amber:#f5a524;
  --amber-2:#ff8a1f;
  --amber-dark:#c9740f;
  --copper:#b8622a;
  --paper:#f4efe4;
  --card:#ffffff;
  --ink:#182233;
  --ink-soft:#5c6b81;
  --line:#e5decb;
  --line-strong:#cdc2a4;
  --success:#22b573;
  --danger:#e4495f;
  --teal:#1fb6a8;
  --radius:14px;
  --shadow-lg:0 30px 60px -20px rgba(6,14,28,0.55);
  --shadow-sm:0 10px 24px -12px rgba(6,14,28,0.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.brand,.tab-btn,.nav-item{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
@keyframes floatY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
@keyframes truckMove{
  0%{ transform:translateX(-6%); }
  50%{ transform:translateX(6%); }
  100%{ transform:translateX(-6%); }
}
@keyframes dashScroll{ to{ background-position:-80px 0; } }
@keyframes pulseRing{
  0%{ box-shadow:0 0 0 0 rgba(245,165,36,0.45); }
  70%{ box-shadow:0 0 0 16px rgba(245,165,36,0); }
  100%{ box-shadow:0 0 0 0 rgba(245,165,36,0); }
}
@keyframes spinSlow{ to{ transform:rotate(360deg); } }
@keyframes shine{
  0%{ background-position:-120% 0; }
  100%{ background-position:220% 0; }
}

/* ---------- LOGISTICS BACKDROP ---------- */
.road-strip{
  position:fixed; top:0; left:0; right:0; height:5px; z-index:5;
  background-image:repeating-linear-gradient(90deg, var(--amber) 0 26px, transparent 26px 46px);
  background-size:46px 5px;
  animation:dashScroll 1.4s linear infinite;
  opacity:.9;
}
.crate-icon,.route-icon,.bottle-icon{display:inline-flex;vertical-align:middle;}

/* ---------- LOGIN / QUICK SCREEN ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(245,165,36,0.18), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(31,182,168,0.14), transparent 45%),
    var(--navy);
  padding:24px;
}
.login-card{
  width:100%;max-width:940px;background:var(--paper);border-radius:20px;
  overflow:hidden;display:grid;grid-template-columns:1.1fr 1.4fr;
  box-shadow:var(--shadow-lg);
}
#quick-screen{
  display:none;min-height:100vh;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(245,165,36,0.18), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(31,182,168,0.14), transparent 45%),
    var(--navy);
  padding:24px;
}
#quick-screen.show{display:flex;}
@media (max-width:820px){ .login-card{grid-template-columns:1fr;} .login-hero{display:none;} }
.login-hero{
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.login-hero .platenum{
  font-family:'IBM Plex Mono',monospace;letter-spacing:3px;font-weight:600;
  background:linear-gradient(120deg,var(--amber),var(--amber-2));color:var(--navy-2);display:inline-block;padding:6px 12px;border-radius:6px;
  font-size:13px;margin-bottom:18px;
}
.login-hero h1{font-size:28px;line-height:1.2;margin:0 0 10px;}
.login-hero p{color:#c7d0dc;font-size:14px;line-height:1.6;}
.route-line{margin-top:30px;border-top:1px dashed rgba(255,255,255,0.25);padding-top:16px;font-size:12px;color:#9fb0c2;}
.login-body{padding:38px 36px;}
.seg-tabs{display:flex;background:#ece4d0;border-radius:12px;padding:4px;margin-bottom:22px;}
.seg-tabs button{flex:1;border:none;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-soft);transition:background .18s ease,color .18s ease;}
.seg-tabs button.active{background:var(--navy);color:#fff;}
.subtabs{display:flex;gap:18px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.subtabs button{background:none;border:none;padding:6px 2px 10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
.subtabs button.active{color:var(--navy);border-color:var(--amber);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.2px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line-strong);border-radius:10px;
  font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,165,36,0.16);}
.btn{
  border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  transition:transform .12s ease, box-shadow .18s ease, background .18s ease;
  position:relative;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(120deg,var(--amber) 0%,var(--amber-2) 100%);color:#231200;box-shadow:0 10px 22px -8px rgba(245,165,36,0.6);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(245,165,36,0.75);}
.btn-navy{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-soft) 100%);color:#fff;}
.btn-navy:hover{transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(12,25,48,0.65);}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line-strong);}
.btn-ghost:hover{background:#efe9d8;border-color:var(--amber);}
.btn-danger{background:#fce6e9;color:var(--danger);}
.btn-danger:hover{background:#f7d1d7;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:12.5px;text-decoration:underline;padding:0;}

/* ---------- APP SHELL ---------- */
html,body{overflow-x:hidden;max-width:100%;}
#app-screen{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
#app-screen.show{display:grid;}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:22px 16px;display:flex;flex-direction:column;}
.sidebar .brand{font-size:16px;font-weight:700;margin-bottom:2px;}
.sidebar .brand small{display:block;color:#9fb0c2;font-weight:400;font-size:11px;font-family:'Inter',sans-serif;margin-top:2px;}
.sidebar .user-chip{margin-top:20px;background:rgba(255,255,255,0.07);border-radius:12px;padding:12px;font-size:12.5px;}
.sidebar .user-chip .nm{font-weight:600;font-size:13.5px;}
.sidebar .user-chip .cc{color:#9fb0c2;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#c7d0dc;
  font-size:13.5px;font-weight:600;margin-top:6px;background:none;border:none;text-align:left;width:100%;
  transition:background .15s ease, color .15s ease;
}
.nav-item.active{background:linear-gradient(120deg,var(--amber),var(--amber-2));color:#211200;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.09);}
.nav-group{margin-top:22px;flex:1;}
.sidebar .logout{margin-top:auto;}
.main{padding:28px 34px;overflow-y:auto;height:100vh;}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.topline h2{margin:0;font-size:21px;}
.topline .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
.view{display:none;}
.view.active{display:block;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.card h3{margin:0 0 16px;font-size:15.5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

/* ---------- MOBILE APP SHELL ---------- */
.mobile-topbar{display:none;}
.sidebar-overlay{display:none;}
@media (max-width:880px){
  #app-screen.show{grid-template-columns:1fr;}

  .mobile-topbar{
    display:flex;align-items:center;gap:12px;
    background:var(--navy);color:#fff;padding:12px 16px;
    position:sticky;top:0;z-index:600;
  }
  .mobile-topbar .hamburger{
    background:none;border:none;color:#fff;font-size:22px;line-height:1;
    padding:4px 6px;border-radius:6px;
  }
  .mobile-topbar .hamburger:active{background:rgba(255,255,255,0.12);}
  .mobile-topbar .mt-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
  .mobile-topbar .mt-brand small{display:block;color:#9fb0c2;font-weight:400;font-size:10.5px;}

  .sidebar{
    position:fixed;top:0;left:0;height:100vh;width:80%;max-width:270px;
    z-index:900;transform:translateX(-100%);transition:transform .25s ease;
    overflow-y:auto;box-shadow:12px 0 30px rgba(0,0,0,0.25);
  }
  .sidebar.open{transform:translateX(0);}

  .sidebar-overlay{
    display:block;position:fixed;inset:0;background:rgba(9,16,25,0.55);
    z-index:850;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .sidebar-overlay.show{opacity:1;pointer-events:auto;}

  .main{padding:18px 16px 40px;height:auto;min-height:calc(100vh - 52px);overflow-x:hidden;}
  .topline{flex-wrap:wrap;row-gap:10px;}
  .topline h2{font-size:18px;}

  .card{padding:16px;}
  table.datatable{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  .product-row{grid-template-columns:1fr;}
  .modal-box{padding:20px 16px;max-height:calc(100vh - 32px);overflow-y:auto;}
  .modal-overlay{padding:16px 10px;}
  .ticket{padding:14px;gap:10px;}
  .ticket .tk-main{min-width:0;}
}

/* Ticket-style waybill card for día laborado */
.ticket{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px 20px;
  margin-bottom:12px;position:relative;border-left:6px solid var(--amber);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-sm);transition:transform .15s ease, box-shadow .15s ease;
}
.ticket::before{
  content:'';position:absolute;left:-1px;top:0;bottom:0;width:6px;
  background-image:repeating-linear-gradient(180deg,#fff 0 6px,transparent 6px 12px);
  opacity:.55;
}
.ticket:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(12,25,48,0.35);}
.ticket .platebadge{
  font-family:'IBM Plex Mono',monospace;background:linear-gradient(120deg,var(--navy),var(--navy-soft));color:#fff;font-weight:700;
  padding:5px 10px;border-radius:6px;font-size:12.5px;letter-spacing:1px;
}
.ticket .tk-main{display:flex;flex-direction:column;gap:5px;flex:1;min-width:220px;}
.ticket .tk-date{font-weight:700;font-size:13.5px;}
.ticket .tk-desc{color:var(--ink-soft);font-size:12.5px;}
.ticket .tk-val{font-weight:800;color:var(--navy);font-size:15px;}
.ticket.discount{border-left-color:var(--danger);}
.ticket.discount .tk-val{color:var(--danger);}
.ticket-actions{display:flex;gap:6px;}

table.datatable{width:100%;border-collapse:collapse;font-size:13px;}
table.datatable th{text-align:left;background:#ece4d0;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);}
table.datatable td{padding:9px 10px;border-bottom:1px solid var(--line);}
table.datatable tr:last-child td{border-bottom:none;}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.pill-orange{background:#fdead0;color:var(--amber-dark);}
.pill-navy{background:#dfe6ee;color:var(--navy);}

.empty-state{padding:30px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(7,14,26,0.62);display:none;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:1000;backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:18px;max-width:620px;width:100%;padding:26px 28px;position:relative;box-shadow:var(--shadow-lg);animation:fadeSlideUp .22s ease;}
.modal-box h3{margin-top:0;}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);}
.product-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast-msg{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 20px rgba(0,0,0,0.28);max-width:300px;animation:fadeSlideUp .2s ease;}
.toast-msg.err{background:var(--danger);}
.toast-msg.ok{background:var(--success);}

.inline-add{display:flex;gap:6px;margin-top:6px;}
.inline-add input{flex:1;}

.catalog-list{list-style:none;margin:0;padding:0;}
.catalog-list li{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.catalog-list li:last-child{border-bottom:none;}
.catalog-list .cl-name{font-weight:600;}
.catalog-list .cl-val{color:var(--ink-soft);font-size:12.5px;margin-left:8px;}

.hidden{display:none !important;}
.small-note{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.section-divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* Vista previa de reporte antes de generar PDF */
.preview-overlay{
  position:fixed;inset:0;background:rgba(7,14,26,0.68);display:none;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;z-index:1100;
}
.preview-overlay.show{display:flex;}
.preview-panel{
  background:#efe9d9;border-radius:16px;max-width:920px;width:100%;padding:18px;position:relative;
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg);
}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
.preview-header h3{margin:0;font-size:16px;}
.preview-header .small-note{margin:2px 0 0;}
.preview-frame{
  background:#d8d0b8;border-radius:12px;padding:20px;overflow:auto;max-height:68vh;
  display:flex;justify-content:center;
}
.preview-frame .doc-page{box-shadow:0 10px 30px rgba(0,0,0,0.28);}
.preview-actions{display:flex;justify-content:flex-end;gap:10px;padding:0 4px;flex-wrap:wrap;}
@media (max-width:700px){
  .preview-panel{padding:14px;}
  .preview-frame{padding:12px;max-height:60vh;}
  .preview-actions{justify-content:stretch;}
  .preview-actions .btn{flex:1;}
}

/* Printable cuenta de cobro template (offscreen, usado para renderizar el PDF final) */
#print-root{position:fixed;left:-9999px;top:0;}
.doc-page{
  width:816px;min-height:1056px;background:#fff;color:#111;padding:70px 66px;
  font-family:'Times New Roman', Georgia, serif;font-size:14px;box-sizing:border-box;
}
.doc-page .doc-fecha{text-align:right;margin-bottom:26px;}
.doc-page .doc-senores{margin-bottom:4px;}
.doc-page .doc-empresa{font-weight:bold;text-transform:uppercase;}
.doc-page .doc-nit{margin-bottom:20px;}
.doc-page .doc-ref{margin-bottom:6px;}
.doc-page .doc-debe{text-align:right;margin-bottom:14px;}
.doc-page .doc-concepto{margin-bottom:22px;line-height:1.5;}
.doc-page table.doc-table{width:100%;border-collapse:collapse;margin-bottom:6px;}
.doc-page table.doc-table th{border:1px solid #111;padding:6px 8px;font-size:12.5px;background:#eee;}
.doc-page table.doc-table td{border:1px solid #111;padding:5px 8px;font-size:12.5px;}
.doc-page .doc-total-row td{font-weight:bold;}
.doc-page .doc-pagar{margin:16px 0 30px;font-style:italic;}
.doc-page .doc-firma-block{margin-top:50px;}
.doc-page .doc-line{border-top:1px solid #111;width:220px;margin-bottom:4px;}

body{
  background:
    radial-gradient(circle at 12% 15%, rgba(245,165,36,0.14), transparent 42%),
    radial-gradient(circle at 88% 85%, rgba(31,182,168,0.12), transparent 42%),
    var(--paper);
}

/* ---------- QUICK REGISTRO — pantalla principal ---------- */
.quick-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
.quick-card{
  width:100%;max-width:540px;background:var(--paper);border-radius:22px;overflow:hidden;
  box-shadow:var(--shadow-lg);border:1px solid rgba(12,25,48,0.06);
  animation:fadeSlideUp .45s ease;position:relative;
}
.quick-hero{
  background:linear-gradient(150deg,var(--navy) 0%, var(--navy-2) 100%);
  padding:26px 34px 46px;color:#fff;position:relative;overflow:hidden;
}
.quick-hero::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background-image:repeating-linear-gradient(90deg, var(--amber) 0 22px, transparent 22px 40px);
  animation:dashScroll 1.6s linear infinite;
}
.quick-hero .fleet-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
.quick-hero .fleet-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:2.4px;font-weight:700;
  background:linear-gradient(120deg,var(--amber),var(--amber-2));color:var(--navy-2);
  padding:7px 13px;border-radius:8px;font-size:12px;
}
.quick-hero .truck-badge{
  width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;animation:floatY 3.2s ease-in-out infinite;
}
.quick-hero h1{font-size:24px;line-height:1.25;margin:0 0 8px;font-family:'Space Grotesk',sans-serif;}
.quick-hero .quick-sub{color:#c7d0dc;font-size:13.5px;line-height:1.6;margin:0;}
.quick-body{padding:30px 34px 36px;position:relative;}
.quick-body .platenum{display:inline-block;margin-bottom:14px;}
.quick-body h1{font-size:26px;margin:0 0 8px;}
.quick-sub{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 0 20px;}
.route-track{
  position:relative;height:20px;margin:2px 0 22px;
  background-image:linear-gradient(90deg, var(--line-strong) 2px, transparent 2px);
  background-size:14px 2px;background-repeat:repeat-x;background-position:center;
}
.route-track .rt-dot{
  position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translateY(-50%);
}
.route-track .rt-dot.origin{left:0;background:var(--navy);}
.route-track .rt-dot.dest{right:0;background:var(--amber);}
.route-track .rt-truck{
  position:absolute;top:50%;transform:translateY(-70%);animation:truckMove 3.6s ease-in-out infinite;
}
.found-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;
  animation:fadeSlideUp .3s ease;box-shadow:var(--shadow-sm);
}
.found-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
.found-meta{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;margin-top:4px;}
.found-role{display:inline-block;margin-top:8px;background:#dfe6ee;color:var(--navy);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.status{margin-top:14px;font-size:13px;}
.status.err{color:var(--danger);}
#success-screen{display:none;}
.success-icon{
  width:74px;height:74px;border-radius:50%;margin:0 auto 18px;

const CARGUE_POBLACIONES = 'CARGUE POBLACIONES';
const CARGUE_POBLACIONES_VALOR = 28000;
const ALMAVIVA_ENTREGA = 'ENTREGA DE PEDIDOS ALMAVIVA';
const ALMAVIVA_ENTREGA_VALOR = 28000;

const State = {
  session:null,
  catalogos:{placas:[],conductores:[],tipos_servicio:[],ciudades:[],lugares:[],productos:[]},

function money(n){n=Number(n)||0;return '$ '+n.toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:0})}
function rand4(){return String(Math.floor(1000+Math.random()*9000))}
function todayISO(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,type){const el=document.createElement('div');el.className='toast-msg'+(type?(' '+type):'');el.textContent=msg;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),4200)}
function openModal(html){document.getElementById('modal-box').innerHTML=`<button class="modal-close" onclick="closeModal()">&times;</button>${html}`;document.getElementById('modal-overlay').classList.add('show')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');document.getElementById('modal-box').innerHTML=''}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});

const Catalogos = {
  async loadAll(){
    const [p,c,t,ci,lg,pr] = await Promise.all([
      sb.from('placas').select('*').order('placa'),
      sb.from('conductores').select('*').order('nombre'),
      sb.from('tipos_servicio').select('*').order('nombre'),
      sb.from('ciudades').select('*').order('nombre'),
      sb.from('lugares_gasto').select('*').order('nombre'),
      sb.from('productos').select('*').order('nombre')
    ]);
    State.catalogos.placas = p.data||[];
    State.catalogos.conductores = c.data||[];
    State.catalogos.tipos_servicio = t.data||[];
    State.catalogos.ciudades = ci.data||[];
    State.catalogos.lugares = lg.data||[];
    State.catalogos.productos = pr.data||[];
    await Catalogos._ensureCarguePoblaciones();
    await Catalogos._ensureLugaresBase();
  },
  async _ensureLugaresBase(){
    const base = ['Zona Bananera','Santa Ana','Río Frío'];
    const faltantes = base.filter(n=>!State.catalogos.lugares.some(l=>(l.nombre||'').trim().toLowerCase()===n.toLowerCase()));
    if(!faltantes.length) return;
    const { error } = await sb.from('lugares_gasto').insert(faltantes.map(nombre=>({nombre})));
    if(!error){
      const { data } = await sb.from('lugares_gasto').select('*').order('nombre');
      State.catalogos.lugares = data||[];
    }
  },
  async _ensureCarguePoblaciones(){
    const existe = State.catalogos.tipos_servicio.some(t=>(t.nombre||'').trim().toUpperCase()===CARGUE_POBLACIONES);
    if(existe) return;
    const { data, error } = await sb.from('tipos_servicio').insert({nombre:'CARGUE POBLACIONES'}).select();
    if(!error && data && data.length){
      State.catalogos.tipos_servicio.push(data[0]);
      State.catalogos.tipos_servicio.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
    }
  },
  async add(table, field, inputId){
    const input = document.getElementById(inputId);
    const value = input.value.trim();
    if(!value){ toast('Escribe un valor','err'); return; }
    const payload = {}; payload[field]=value;
    const { error } = await sb.from(table).insert(payload);
    if(error){ toast('No se pudo agregar (¿ya existe?)','err'); return; }
    input.value='';
    await Catalogos.loadAll();
    Catalogos.renderAll();
    toast('Agregado correctamente','ok');
  },
  async addConductor(){
    const nombre = document.getElementById('new-conductor').value.trim();
    const valorEl = document.getElementById('new-conductor-valor');
    const valor = valorEl.value ? Number(valorEl.value) : 80000;
    if(!nombre){ toast('Escribe el nombre del conductor','err'); return; }
    const { error } = await sb.from('conductores').insert({ nombre, valor_dia: valor });
    if(error){ toast('No se pudo agregar (¿ya existe?)','err'); return; }
    document.getElementById('new-conductor').value='';
    valorEl.value='';
    await Catalogos.loadAll();
    Catalogos.renderAll();
    toast('Conductor agregado','ok');
  },
  async remove(table, id){
    if(!confirm('¿Eliminar este elemento del catálogo?')) return;
    const { error } = await sb.from(table).delete().eq('id', id);
    if(error){ toast('No se pudo eliminar','err'); return; }
    await Catalogos.loadAll();
    Catalogos.renderAll();
  },
  async updateConductorValor(id, valor){
    await sb.from('conductores').update({ valor_dia: Number(valor)||0 }).eq('id', id);
    await Catalogos.loadAll();
    toast('Valor actualizado','ok');
  },
  async cargarProductosExcel(){
    const fileInput = document.getElementById('productos-file');
    const file = fileInput.files[0];
    if(!file){ toast('Selecciona un archivo Excel','err'); return; }
    let rows;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {header:1});
    }catch(e){
      toast('No se pudo leer el archivo','err'); return;
    }
    if(!rows || !rows.length){ toast('El archivo está vacío','err'); return; }
    let startIdx = 0;
    if(rows[0] && rows[0].some(cell => String(cell||'').toUpperCase().includes('NOMBRE') || String(cell||'').toUpperCase().includes('PRODUCTO'))){
      startIdx = 1;
    }
    const nombres = rows.slice(startIdx).map(r => String((r&&r[0])||'').trim()).filter(Boolean);
    if(!nombres.length){ toast('No se encontraron nombres de producto en el archivo','err'); return; }
    const existentes = new Set(State.catalogos.productos.map(p=>(p.nombre||'').trim().toLowerCase()));
    const unicos = [...new Set(nombres.map(n=>n))].filter(n=>!existentes.has(n.trim().toLowerCase()));
    if(!unicos.length){ toast('Todos esos productos ya existían en el catálogo','err'); return; }
    const { error } = await sb.from('productos').insert(unicos.map(nombre=>({nombre})));
    if(error){ toast('No se pudo cargar el listado de productos','err'); return; }
    fileInput.value = '';
    await Catalogos.loadAll();
    Catalogos.renderAll();
    toast(`${unicos.length} producto(s) agregado(s) al catálogo`,'ok');
  },
  renderAll(){
    const mk = (arr, table, withVal) => arr.map(it=>`
      <li>
        <span>
          <span class="cl-name">${esc(it.placa||it.nombre)}</span>
          ${withVal?`<input type="number" value="${it.valor_dia}" class="mono" style="width:90px;margin-left:8px;padding:3px 6px;border:1px solid var(--line-strong);border-radius:5px;" onchange="Catalogos.updateConductorValor('${it.id}', this.value)">`:''}
        </span>
        <button class="btn btn-danger btn-sm" onclick="Catalogos.remove('${table}','${it.id}')">Eliminar</button>
      </li>`).join('') || '<li class="empty-state" style="border:none;">Sin registros</li>';
    document.getElementById('cat-placas').innerHTML = mk(State.catalogos.placas,'placas',false);
    document.getElementById('cat-conductores').innerHTML = mk(State.catalogos.conductores,'conductores',true);
    document.getElementById('cat-servicios').innerHTML = mk(State.catalogos.tipos_servicio,'tipos_servicio',false);
    document.getElementById('cat-ciudades').innerHTML = mk(State.catalogos.ciudades,'ciudades',false);
    document.getElementById('cat-lugares').innerHTML = mk(State.catalogos.lugares,'lugares_gasto',false);
    document.getElementById('cat-productos').innerHTML = mk(State.catalogos.productos,'productos',false);
  }
};

const Aux = {
  async saveOnboarding(){
    const nombre = document.getElementById('ob-nombre').value.trim();
    const telefono = document.getElementById('ob-telefono').value.trim();
    const correo = document.getElementById('ob-correo').value.trim();
    const direccion = document.getElementById('ob-direccion').value.trim();
    const rol = document.getElementById('ob-rol').value || 'auxiliar';
    if(!nombre || !direccion){ toast('Completa al menos nombre y dirección','err'); return; }
    const payload = { nombre_completo:nombre, telefono, correo, direccion, tipo_usuario: rol };
    const { data, error } = await sb.from('auxiliares').update(payload).eq('id', State.session.auxiliar.id).select().single();
    if(error){ toast('No se pudo guardar el perfil','err'); return; }
    State.session.auxiliar = data;
    toast('Perfil guardado','ok');
    UI.showApp('dias');
  },
  fillProfileForm(){
    const a = State.session.auxiliar;
    document.getElementById('pf-nombre').value = a.nombre_completo||'';
    document.getElementById('pf-cedula').value = a.cedula||'';
    document.getElementById('pf-telefono').value = a.telefono||'';
    document.getElementById('pf-correo').value = a.correo||'';
    document.getElementById('pf-direccion').value = a.direccion||'';
    document.getElementById('pf-rol').value = a.tipo_usuario||'auxiliar';
  },
  async saveProfile(){
    const payload = {
      nombre_completo: document.getElementById('pf-nombre').value.trim(),
      telefono: document.getElementById('pf-telefono').value.trim(),
      correo: document.getElementById('pf-correo').value.trim(),
      direccion: document.getElementById('pf-direccion').value.trim(),
      tipo_usuario: document.getElementById('pf-rol').value || 'auxiliar'
    };
    const { data, error } = await sb.from('auxiliares').update(payload).eq('id', State.session.auxiliar.id).select().single();
    if(error){ toast('No se pudo guardar','err'); return; }
    State.session.auxiliar = data;
    UI.buildNav();
    toast('Perfil actualizado','ok');
  },
  async changePin(){
    const old = document.getElementById('pf-pin-old').value.trim();
    const n1 = document.getElementById('pf-pin-new').value.trim();
    const n2 = document.getElementById('pf-pin-new2').value.trim();
    if(String(State.session.auxiliar.password)!==old){ toast('La contraseña actual no coincide','err'); return; }
    if(!/^\d{4}$/.test(n1)){ toast('La nueva contraseña debe tener 4 dígitos','err'); return; }
    if(n1!==n2){ toast('Las contraseñas nuevas no coinciden','err'); return; }
    const { data, error } = await sb.from('auxiliares').update({password:n1}).eq('id', State.session.auxiliar.id).select().single();
    if(error){ toast('No se pudo actualizar','err'); return; }
    State.session.auxiliar = data;
    document.getElementById('pf-pin-old').value='';
    document.getElementById('pf-pin-new').value='';
    document.getElementById('pf-pin-new2').value='';
    toast('Contraseña actualizada','ok');
  },

  /* ---- días laborados ---- */
  async renderDias(){
    const { data } = await sb.from('registros').select('*').eq('auxiliar_id', State.session.auxiliar.id).order('fecha', {ascending:false});
    State.registrosCache = data||[];
    const list = document.getElementById('dias-list');
    if(!State.registrosCache.length){ list.innerHTML = '<div class="empty-state">Aún no has registrado días laborados.</div>'; return; }
    list.innerHTML = State.registrosCache.map(r=>Aux._ticketHTML(r,true)).join('');
  },
  _ticketHTML(r, editable){
    const desc = r.es_descuento ? `Descuento: ${r.actividad}` : `${esc(r.actividad)}`;
    return `
    <div class="ticket ${r.es_descuento?'discount':''}">
      <span class="platebadge">${esc(r.placa||'-')}</span>
      <div class="tk-main">
        <div class="tk-date">${fmtDate(r.fecha)} ${r.conductor && r.conductor!=='-' ? '· '+esc(r.conductor):''}</div>
        <div class="tk-desc">${desc}${r.ciudad?(' · '+esc(r.ciudad)):''}</div>
      </div>
      <div class="tk-val">${money(r.valor)}</div>
      ${editable?`<div class="ticket-actions">
        <button class="btn btn-ghost btn-sm" onclick="Aux.openRegistroForm('${r.id}')">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="Aux.deleteRegistro('${r.id}')">Eliminar</button>
      </div>`:''}
    </div>`;
  },
  async deleteRegistro(id){
    if(!confirm('¿Eliminar este registro?')) return;
    await sb.from('registros').delete().eq('id', id);
    Aux.renderDias();
    toast('Registro eliminado','ok');
  },
  _esTransportista(){
    return !!(State.session && State.session.auxiliar && State.session.auxiliar.tipo_usuario==='transportista');
  },
  openRegistroForm(id){
    if(Aux._esTransportista()) return Aux._openRegistroFormTransportista(id);
    State.editRegistroId = id||null;
    const editing = id ? State.registrosCache.find(r=>r.id===id) : null;
    State.productosEstampillado = (editing && editing.productos && editing.productos.length) ? JSON.parse(JSON.stringify(editing.productos)) : [];
    const conceptoActual = editing ? editing.concepto : 'Ruta';

    const opts = (arr, field, current) => arr.map(o=>`<option value="${esc(o[field])}" ${current===o[field]?'selected':''}>${esc(o[field])}</option>`).join('') + `<option value="__nuevo__">+ Agregar nueva opción…</option>`;
    const conductorOpts = (current) => `<option value="Ninguno" ${current==='Ninguno'||!current?'selected':''}>Ninguno</option>` +
      State.catalogos.conductores.map(o=>`<option value="${esc(o.nombre)}" ${current===o.nombre?'selected':''}>${esc(o.nombre)}</option>`).join('') +
      `<option value="__nuevo__">+ Agregar nueva opción…</option>`;

    openModal(`
      <h3>${editing?'Editar':'Nuevo'} día laborado</h3>
      <div class="grid2">
        <div class="field"><label>Fecha</label><input type="date" id="rf-fecha" value="${editing?editing.fecha:todayISO()}"></div>
        <div class="field"><label>Placa</label>
          <select id="rf-placa" onchange="Aux._maybeInlineAdd('placa')">${opts(State.catalogos.placas,'placa', editing?editing.placa:null)}</select>
          <div class="inline-add hidden" id="add-placa-wrap"><input id="add-placa-input" placeholder="Nueva placa"><button class="btn btn-navy btn-sm" onclick="Aux._inlineSave('placas','placa','add-placa-input','rf-placa')">Guardar</button></div>
        </div>
      </div>
      <div class="field"><label>¿Es estampillado o ruta?</label>
        <select id="rf-concepto" onchange="Aux._onConceptoChange()">
          <option value="Ruta" ${conceptoActual==='Ruta'?'selected':''}>Ruta</option>
          <option value="Estampillado" ${conceptoActual==='Estampillado'?'selected':''}>Estampillado</option>
          <option value="Cargue" ${conceptoActual==='Cargue'?'selected':''}>Cargue</option>
        </select>
      </div>

      <div id="ruta-block">
        <div class="grid2">
          <div class="field"><label>Tipo de ruta</label>
            <select id="rf-tiposervicio" onchange="Aux._maybeInlineAdd('tiposervicio'); Aux._recalcValor(); Aux._actualizarConductorVisible();">${opts(State.catalogos.tipos_servicio,'nombre', editing?editing.tipo_servicio:null)}</select>
            <div class="inline-add hidden" id="add-tiposervicio-wrap"><input id="add-tiposervicio-input" placeholder="Nuevo tipo de ruta"><button class="btn btn-navy btn-sm" onclick="Aux._inlineSave('tipos_servicio','nombre','add-tiposervicio-input','rf-tiposervicio')">Guardar</button></div>
          </div>
          <div class="field" id="conductor-field-wrap"><label>Conductor</label>
            <select id="rf-conductor" onchange="Aux._maybeInlineAdd('conductor'); Aux._recalcValor();">${conductorOpts(editing?editing.conductor:null)}</select>
            <div class="inline-add hidden" id="add-conductor-wrap"><input id="add-conductor-input" placeholder="Nuevo conductor"><button class="btn btn-navy btn-sm" onclick="Aux._inlineSaveConductor()">Guardar</button></div>
          </div>
        </div>
      </div>

      <div id="estampillado-block" class="hidden">
        <label style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;">Productos estampillados (valor de la estampilla: $30 c/u)</label>
        <div id="productos-rows"></div>
        <button class="btn btn-ghost btn-sm" onclick="Aux._addProductoRow()">+ Agregar producto</button>
      </div>

      <div class="field" style="margin-top:14px;"><label>Valor del día</label><input id="rf-valor" class="mono" value="${editing?editing.valor:0}" disabled></div>

      <div class="field"><label>Ciudad / población de entrega</label>
        <select id="rf-ciudad" onchange="Aux._maybeInlineAdd('ciudad')">${opts(State.catalogos.ciudades,'nombre', editing?editing.ciudad:null)}</select>
        <div class="inline-add hidden" id="add-ciudad-wrap"><input id="add-ciudad-input" placeholder="Nueva ciudad/población"><button class="btn btn-navy btn-sm" onclick="Aux._inlineSave('ciudades','nombre','add-ciudad-input','rf-ciudad')">Guardar</button></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="Aux.saveRegistro()">Guardar registro</button>
    `);
    setTimeout(()=>{
      const esEstampillado = conceptoActual==='Estampillado';
      document.getElementById('estampillado-block').classList.toggle('hidden', !esEstampillado);
      document.getElementById('ruta-block').classList.toggle('hidden', esEstampillado);
      Aux._actualizarConductorVisible();
      if(esEstampillado && !State.productosEstampillado.length){ State.productosEstampillado=[{referencia:'',cantidad:1}]; }
      Aux._renderProductoRows();
      if(!editing) Aux._recalcValor();
    }, 30);
  },
  _maybeInlineAdd(key){
    const sel = document.getElementById('rf-'+key);
    document.getElementById('add-'+key+'-wrap').classList.toggle('hidden', sel.value!=='__nuevo__');
  },
  async _inlineSave(table, field, inputId, selectId){
    const val = document.getElementById(inputId).value.trim();
    if(!val){ toast('Escribe un valor','err'); return; }
    const payload={}; payload[field]=val;
    const { error } = await sb.from(table).insert(payload);
    if(error){ toast('No se pudo agregar','err'); return; }
    await Catalogos.loadAll();
    const sel = document.getElementById(selectId);
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = val;
    document.getElementById(inputId.replace('-input','-wrap')).classList.add('hidden');
    toast('Agregado','ok');
    if(selectId==='rf-conductor') Aux._recalcValor();
  },
  async _inlineSaveConductor(){
    const val = document.getElementById('add-conductor-input').value.trim();
    if(!val){ toast('Escribe un nombre','err'); return; }
    const { error } = await sb.from('conductores').insert({nombre:val, valor_dia:80000});
    if(error){ toast('No se pudo agregar','err'); return; }
    await Catalogos.loadAll();
    const sel = document.getElementById('rf-conductor');
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = val;
    document.getElementById('add-conductor-wrap').classList.add('hidden');
    Aux._recalcValor();
    toast('Conductor agregado (valor $80.000)','ok');
  },
  _onConceptoChange(){
    const concepto = document.getElementById('rf-concepto').value;
    const esEstampillado = concepto==='Estampillado';
    document.getElementById('estampillado-block').classList.toggle('hidden', !esEstampillado);
    document.getElementById('ruta-block').classList.toggle('hidden', esEstampillado);
    Aux._actualizarConductorVisible();
    if(esEstampillado && !State.productosEstampillado.length){ State.productosEstampillado=[{referencia:'',cantidad:1}]; Aux._renderProductoRows(); }
    Aux._recalcValor();
  },
  _actualizarConductorVisible(){
    const concepto = document.getElementById('rf-concepto').value;
    const esCargue = concepto==='Cargue';
    const tiposervicioEl = document.getElementById('rf-tiposervicio');
    const tipoServicio = tiposervicioEl ? (tiposervicioEl.value||'').trim().toUpperCase() : '';
    const ocultarConductor = esCargue || tipoServicio.includes('ALMAVIVA');
    document.getElementById('conductor-field-wrap').classList.toggle('hidden', ocultarConductor);
  },
  _recalcValor(){
    const concepto = document.getElementById('rf-concepto').value;
    let valor = 0;
    if(concepto==='Estampillado'){
      valor = State.productosEstampillado.reduce((s,p)=> s + (Number(p.cantidad)||0)*30, 0);
    } else if(concepto==='Cargue'){
      valor = CARGUE_POBLACIONES_VALOR;
    } else {
      const tiposervicioEl = document.getElementById('rf-tiposervicio');
      const tipoServicio = tiposervicioEl ? (tiposervicioEl.value||'').trim().toUpperCase() : '';
      if(tipoServicio===CARGUE_POBLACIONES){
        valor = CARGUE_POBLACIONES_VALOR;
      } else if(tipoServicio.includes('ALMAVIVA')){
        valor = ALMAVIVA_ENTREGA_VALOR;
      } else {
        const nombre = document.getElementById('rf-conductor').value;
        if(nombre==='Ninguno' || nombre==='__nuevo__' || !nombre){
          valor = 0;
        } else {
          const found = State.catalogos.conductores.find(c=>c.nombre===nombre);
          valor = found ? Number(found.valor_dia) : 80000;
        }
      }
    }
    document.getElementById('rf-valor').value = valor;
  },
  _addProductoRow(){
    State.productosEstampillado.push({referencia:'',cantidad:1});
    Aux._renderProductoRows();
    Aux._recalcValor();
  },
  _renderProductoRows(){
    const wrap = document.getElementById('productos-rows');
    if(!wrap) return;
    const prodOpts = (current) => `<option value="">Selecciona un producto…</option>` +
      State.catalogos.productos.map(p=>`<option value="${esc(p.nombre)}" ${current===p.nombre?'selected':''}>${esc(p.nombre)}</option>`).join('') +
      (current && !State.catalogos.productos.some(p=>p.nombre===current) ? `<option value="${esc(current)}" selected>${esc(current)}</option>` : '');
    wrap.innerHTML = State.productosEstampillado.map((p,i)=>`
      <div class="product-row">
        <select onchange="State.productosEstampillado[${i}].referencia=this.value">${prodOpts(p.referencia)}</select>
        <input type="number" min="1" placeholder="Cant." value="${p.cantidad}" oninput="State.productosEstampillado[${i}].cantidad=this.value; Aux._recalcValor();">
        <button class="btn btn-danger btn-sm" onclick="Aux._removeProductoRow(${i})">✕</button>
      </div>`).join('');
    if(!State.catalogos.productos.length){
      wrap.innerHTML += '<p class="small-note">No hay productos cargados. Pide al administrador que los agregue en Catálogos.</p>';
    }
  },
  _removeProductoRow(i){
    State.productosEstampillado.splice(i,1);
    Aux._renderProductoRows();
    Aux._recalcValor();
  },
  async saveRegistro(){
    const fecha = document.getElementById('rf-fecha').value;
    const placa = document.getElementById('rf-placa').value;
    const concepto = document.getElementById('rf-concepto').value;
    const ciudad = document.getElementById('rf-ciudad').value;
    const esEstampillado = concepto==='Estampillado';
    const esCargue = concepto==='Cargue';

    let conductor = 'Ninguno', tipo_servicio = '-';
    if(!esEstampillado){
      tipo_servicio = document.getElementById('rf-tiposervicio').value;
      conductor = esCargue ? 'Ninguno' : document.getElementById('rf-conductor').value;
    }

    if([placa,ciudad].includes('__nuevo__') || (!esEstampillado && tipo_servicio==='__nuevo__') || (!esEstampillado && !esCargue && conductor==='__nuevo__')){
      toast('Guarda las opciones nuevas antes de continuar','err'); return;
    }
    if(!fecha || !placa || !ciudad){ toast('Completa todos los campos','err'); return; }
    if(!esEstampillado && !tipo_servicio){ toast('Completa el tipo de ruta','err'); return; }
    if(!esEstampillado && !esCargue && !conductor){ toast('Completa el conductor','err'); return; }

    let productos = [];
    if(esEstampillado){
      productos = State.productosEstampillado.filter(p=>p.referencia && Number(p.cantidad)>0);
      if(!productos.length){ toast('Agrega al menos un producto estampillado con cantidad','err'); return; }
    }

    const valor = Number(document.getElementById('rf-valor').value)||0;

    let actividad;
    if(esEstampillado){
      actividad = 'Estampillado (' + productos.map(p=>`${p.referencia} x${p.cantidad}`).join(', ') + `) - ${ciudad}`;
    } else {
      actividad = `${tipo_servicio} - ${ciudad}`;
    }

    const payload = { auxiliar_id: State.session.auxiliar.id, fecha, placa, conductor, valor, tipo_servicio, concepto, productos, ciudad, actividad, firma:'', es_descuento:false, creado_por:'auxiliar' };

    let error;
    if(State.editRegistroId){
      ({ error } = await sb.from('registros').update(payload).eq('id', State.editRegistroId));
    } else {
      ({ error } = await sb.from('registros').insert(payload));
    }
    if(error){ toast('No se pudo guardar el registro','err'); return; }
    closeModal();
    if(State.session && State.session.tipo==='quick'){
      QuickRegistro.onSaved();
    } else {
      Aux.renderDias();
    }
    toast('Registro guardado','ok');
  },

  /* ---- Formulario reducido y fijo para el rol Transportista ---- */
  _openRegistroFormTransportista(id){
    State.editRegistroId = id||null;
    const editing = id ? State.registrosCache.find(r=>r.id===id) : null;
    const opts = (arr, current) => arr.map(o=>`<option value="${esc(o)}" ${current===o?'selected':''}>${esc(o)}</option>`).join('') + `<option value="__nuevo__">+ Agregar nueva opción…</option>`;

    const conceptoActual = editing ? editing.concepto : TRANSPORTISTA_CONCEPTOS[0];
    const rutaActual = editing ? editing.tipo_servicio : '';

    openModal(`
      <h3>${editing?'Editar':'Nuevo'} día laborado</h3>
      <div class="grid2">
        <div class="field"><label>Fecha</label><input type="date" id="rf-fecha" value="${editing?editing.fecha:todayISO()}"></div>
        <div class="field"><label>Placa</label>
          <select id="rf-placa" onchange="Aux._maybeInlineAdd('placa')">${opts(State.catalogos.placas.map(p=>p.placa), editing?editing.placa:null)}</select>
          <div class="inline-add hidden" id="add-placa-wrap"><input id="add-placa-input" placeholder="Nueva placa"><button class="btn btn-navy btn-sm" onclick="Aux._inlineSave('placas','placa','add-placa-input','rf-placa')">Guardar</button></div>
        </div>
      </div>
      <div class="field"><label>Ruta o estampillado</label>
        <select id="rf-concepto-t">
          ${TRANSPORTISTA_CONCEPTOS.map(c=>`<option value="${esc(c)}" ${conceptoActual===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Tipo de ruta</label>
        <select id="rf-tiporuta-t" onchange="Aux._recalcValorTransportista()">
          <option value="">Selecciona…</option>
          ${Object.keys(TRANSPORTISTA_TIPOS_RUTA).map(t=>`<option value="${esc(t)}" ${rutaActual===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-top:14px;"><label>Valor del día</label><input id="rf-valor" class="mono" value="${editing?editing.valor:0}" disabled></div>
      <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="Aux._saveRegistroTransportista()">Guardar registro</button>
    `);
    setTimeout(()=>{ Aux._recalcValorTransportista(); }, 30);
  },
  _recalcValorTransportista(){
    const sel = document.getElementById('rf-tiporuta-t');
    const tipoRuta = sel ? sel.value : '';
    const valor = TRANSPORTISTA_TIPOS_RUTA[tipoRuta] || 0;
    document.getElementById('rf-valor').value = valor;
  },
  async _saveRegistroTransportista(){
    const fecha = document.getElementById('rf-fecha').value;
    const placa = document.getElementById('rf-placa').value;
    const concepto = document.getElementById('rf-concepto-t').value;
    const tipo_servicio = document.getElementById('rf-tiporuta-t').value;
    const valor = Number(document.getElementById('rf-valor').value)||0;

    if(placa==='__nuevo__'){ toast('Guarda la placa nueva antes de continuar','err'); return; }
    if(!fecha || !placa){ toast('Completa la fecha y la placa','err'); return; }
    if(!tipo_servicio){ toast('Selecciona el tipo de ruta','err'); return; }

    const actividad = `${concepto} - ${tipo_servicio}`;
    const payload = { auxiliar_id: State.session.auxiliar.id, fecha, placa, conductor:'', valor, tipo_servicio, concepto, productos:[], ciudad:'', actividad, firma:'', es_descuento:false, creado_por:'auxiliar' };

    let error;
    if(State.editRegistroId){
      ({ error } = await sb.from('registros').update(payload).eq('id', State.editRegistroId));
    } else {
      ({ error } = await sb.from('registros').insert(payload));
    }
    if(error){ toast('No se pudo guardar el registro','err'); return; }
    closeModal();
    if(State.session && State.session.tipo==='quick'){
      QuickRegistro.onSaved();
    } else {
      Aux.renderDias();
    }
    toast('Registro guardado','ok');
  }
};



const QuickRegistro = {
  persona:null,

  async buscar(){
    const cedula=document.getElementById('quick-cedula').value.trim();
    const status=document.getElementById('quick-status');
    if(!cedula){status.textContent='Ingresa tu número de cédula.';status.className='status err';return;}
    status.textContent='Consultando…';status.className='status';

    // MISMA TABLA Y CAMPO DEL INDEX ORIGINAL:
    // auxiliares.cedula + auxiliares.tipo_usuario.
    const {data,error}=await sb.from('auxiliares').select('*').eq('cedula',cedula).maybeSingle();

    if(error||!data){
      status.textContent='No se encontró esa cédula en la base de datos original.';
      status.className='status err';
      document.getElementById('quick-found').classList.add('hidden');
      return;
    }

    QuickRegistro.persona=data;
    State.session={tipo:'quick',auxiliar:data};

    document.getElementById('quick-name').textContent=data.nombre_completo||'Usuario encontrado';
    document.getElementById('quick-cc').textContent='CC '+data.cedula;
    document.getElementById('quick-role').textContent=data.tipo_usuario==='transportista'?'Transportista':'Auxiliar';
    document.getElementById('quick-found').classList.remove('hidden');
    status.textContent='';status.className='status';
  },

  abrirFormulario(){
    if(!QuickRegistro.persona)return;
    // Aux.openRegistroForm() es el mismo método extraído del index:
    // detecta tipo_usuario=transportista y abre el formulario reducido;
    // en cualquier otro caso abre el formulario completo de auxiliar.
    Aux.openRegistroForm();
  },

  onSaved(){
    closeModal();
    document.getElementById('lookup-screen').style.display='none';
    document.getElementById('success-screen').style.display='flex';
  },

  reset(){
    closeModal();QuickRegistro.persona=null;State.session=null;
    document.getElementById('quick-cedula').value='';
    document.getElementById('quick-found').classList.add('hidden');
    document.getElementById('quick-status').textContent='';
    document.getElementById('quick-status').className='status';
    document.getElementById('success-screen').style.display='none';
    document.getElementById('lookup-screen').style.display='flex';
    setTimeout(()=>document.getElementById('quick-cedula').focus(),30);
  }
};

document.getElementById('quick-cedula').focus();
Catalogos.loadAll();
</script>
</body>
