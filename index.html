<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro rápido de día laborado · LICONSUMAR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root{
  --navy:#12283f;
  --navy-2:#0c1c2e;
  --accent:#f2994a;
  --accent-dark:#d97e34;
  --paper:#f5f3ee;
  --card:#ffffff;
  --ink:#1b232c;
  --ink-soft:#5b6673;
  --line:#e1dccd;
  --line-strong:#c9c2ac;
  --success:#2f9e63;
  --danger:#d1495b;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.brand,.tab-btn,.nav-item{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(242,153,74,0.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(18,40,63,0.18), transparent 45%),
    var(--navy);
  padding:24px;
}
.login-card{
  width:100%;max-width:940px;background:var(--paper);border-radius:18px;
  overflow:hidden;display:grid;grid-template-columns:1.1fr 1.4fr;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
}
#quick-screen{
  display:none;min-height:100vh;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(242,153,74,0.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(18,40,63,0.18), transparent 45%),
    var(--navy);
  padding:24px;
}
#quick-screen.show{display:flex;}
@media (max-width:820px){ .login-card{grid-template-columns:1fr;} .login-hero{display:none;} }
.login-hero{
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;
}
.login-hero .platenum{
  font-family:'IBM Plex Mono',monospace;letter-spacing:3px;font-weight:600;
  background:var(--accent);color:var(--navy-2);display:inline-block;padding:6px 12px;border-radius:5px;
  font-size:13px;margin-bottom:18px;
}
.login-hero h1{font-size:28px;line-height:1.2;margin:0 0 10px;}
.login-hero p{color:#c7d0dc;font-size:14px;line-height:1.6;}
.route-line{margin-top:30px;border-top:1px dashed rgba(255,255,255,0.25);padding-top:16px;font-size:12px;color:#9fb0c2;}
.login-body{padding:38px 36px;}
.seg-tabs{display:flex;background:#ece7d9;border-radius:10px;padding:4px;margin-bottom:22px;}
.seg-tabs button{flex:1;border:none;background:transparent;padding:10px 8px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-soft);}
.seg-tabs button.active{background:var(--navy);color:#fff;}
.subtabs{display:flex;gap:18px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.subtabs button{background:none;border:none;padding:6px 2px 10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
.subtabs button.active{color:var(--navy);border-color:var(--accent);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.2px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;
  font-size:14px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}
.btn{
  border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .05s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#211200;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-2);}
.btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line-strong);}
.btn-ghost:hover{background:#efeadd;}
.btn-danger{background:#fbe7e9;color:var(--danger);}
.btn-danger:hover{background:#f6d3d6;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
.btn-block{width:100%;}
.link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:12.5px;text-decoration:underline;padding:0;}

/* ---------- APP SHELL ---------- */
html,body{overflow-x:hidden;max-width:100%;}
#app-screen{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
#app-screen.show{display:grid;}
.sidebar{background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;}
.sidebar .brand{font-size:16px;font-weight:700;margin-bottom:2px;}
.sidebar .brand small{display:block;color:#9fb0c2;font-weight:400;font-size:11px;font-family:'Inter',sans-serif;margin-top:2px;}
.sidebar .user-chip{margin-top:20px;background:rgba(255,255,255,0.06);border-radius:10px;padding:12px;font-size:12.5px;}
.sidebar .user-chip .nm{font-weight:600;font-size:13.5px;}
.sidebar .user-chip .cc{color:#9fb0c2;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:#c7d0dc;
  font-size:13.5px;font-weight:600;margin-top:6px;background:none;border:none;text-align:left;width:100%;
}
.nav-item.active{background:var(--accent);color:#211200;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.08);}
.nav-group{margin-top:22px;flex:1;}
.sidebar .logout{margin-top:auto;}
.main{padding:28px 34px;overflow-y:auto;height:100vh;}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.topline h2{margin:0;font-size:21px;}
.topline .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
.view{display:none;}
.view.active{display:block;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
.card h3{margin:0 0 16px;font-size:15.5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

/* ---------- MOBILE APP SHELL ---------- */
.mobile-topbar{display:none;}
.sidebar-overlay{display:none;}
@media (max-width:880px){
  #app-screen.show{grid-template-columns:1fr;}

  .mobile-topbar{
    display:flex;align-items:center;gap:12px;
    background:var(--navy);color:#fff;padding:12px 16px;
    position:sticky;top:0;z-index:600;
  }
  .mobile-topbar .hamburger{
    background:none;border:none;color:#fff;font-size:22px;line-height:1;
    padding:4px 6px;border-radius:6px;
  }
  .mobile-topbar .hamburger:active{background:rgba(255,255,255,0.12);}
  .mobile-topbar .mt-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
  .mobile-topbar .mt-brand small{display:block;color:#9fb0c2;font-weight:400;font-size:10.5px;}

  .sidebar{
    position:fixed;top:0;left:0;height:100vh;width:80%;max-width:270px;
    z-index:900;transform:translateX(-100%);transition:transform .25s ease;
    overflow-y:auto;box-shadow:12px 0 30px rgba(0,0,0,0.25);
  }
  .sidebar.open{transform:translateX(0);}

  .sidebar-overlay{
    display:block;position:fixed;inset:0;background:rgba(9,16,25,0.55);
    z-index:850;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .sidebar-overlay.show{opacity:1;pointer-events:auto;}

  .main{padding:18px 16px 40px;height:auto;min-height:calc(100vh - 52px);overflow-x:hidden;}
  .topline{flex-wrap:wrap;row-gap:10px;}
  .topline h2{font-size:18px;}

  .card{padding:16px;}
  table.datatable{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  .product-row{grid-template-columns:1fr;}
  .modal-box{padding:20px 16px;max-height:calc(100vh - 32px);overflow-y:auto;}
  .modal-overlay{padding:16px 10px;}
  .ticket{padding:14px;gap:10px;}
  .ticket .tk-main{min-width:0;}
}

/* Ticket-style waybill card for día laborado */
.ticket{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px 16px 20px;
  margin-bottom:12px;position:relative;border-left:6px dashed var(--accent);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
}
.ticket .platebadge{
  font-family:'IBM Plex Mono',monospace;background:var(--navy);color:#fff;font-weight:600;
  padding:4px 9px;border-radius:5px;font-size:12.5px;letter-spacing:1px;
}
.ticket .tk-main{display:flex;flex-direction:column;gap:5px;flex:1;min-width:220px;}
.ticket .tk-date{font-weight:700;font-size:13.5px;}
.ticket .tk-desc{color:var(--ink-soft);font-size:12.5px;}
.ticket .tk-val{font-weight:700;color:var(--navy);font-size:15px;}
.ticket.discount{border-left-color:var(--danger);}
.ticket.discount .tk-val{color:var(--danger);}
.ticket-actions{display:flex;gap:6px;}

table.datatable{width:100%;border-collapse:collapse;font-size:13px;}
table.datatable th{text-align:left;background:#eee8d8;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);}
table.datatable td{padding:9px 10px;border-bottom:1px solid var(--line);}
table.datatable tr:last-child td{border-bottom:none;}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-orange{background:#fdecd9;color:var(--accent-dark);}
.pill-navy{background:#dfe6ee;color:var(--navy);}

.empty-state{padding:30px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(12,20,30,0.55);display:none;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:1000;
}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;max-width:620px;width:100%;padding:26px 28px;position:relative;}
.modal-box h3{margin-top:0;}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);}
.product-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast-msg{background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 20px rgba(0,0,0,0.25);max-width:300px;}
.toast-msg.err{background:var(--danger);}
.toast-msg.ok{background:var(--success);}

.inline-add{display:flex;gap:6px;margin-top:6px;}
.inline-add input{flex:1;}

.catalog-list{list-style:none;margin:0;padding:0;}
.catalog-list li{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.catalog-list li:last-child{border-bottom:none;}
.catalog-list .cl-name{font-weight:600;}
.catalog-list .cl-val{color:var(--ink-soft);font-size:12.5px;margin-left:8px;}

.hidden{display:none !important;}
.small-note{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.section-divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* Vista previa de reporte antes de generar PDF */
.preview-overlay{
  position:fixed;inset:0;background:rgba(12,20,30,0.65);display:none;align-items:flex-start;justify-content:center;
  padding:30px 16px;overflow-y:auto;z-index:1100;
}
.preview-overlay.show{display:flex;}
.preview-panel{
  background:#efece2;border-radius:14px;max-width:920px;width:100%;padding:18px;position:relative;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
.preview-header h3{margin:0;font-size:16px;}
.preview-header .small-note{margin:2px 0 0;}
.preview-frame{
  background:#d8d3c2;border-radius:10px;padding:20px;overflow:auto;max-height:68vh;
  display:flex;justify-content:center;
}
.preview-frame .doc-page{box-shadow:0 10px 30px rgba(0,0,0,0.28);}
.preview-actions{display:flex;justify-content:flex-end;gap:10px;padding:0 4px;flex-wrap:wrap;}
@media (max-width:700px){
  .preview-panel{padding:14px;}
  .preview-frame{padding:12px;max-height:60vh;}
  .preview-actions{justify-content:stretch;}
  .preview-actions .btn{flex:1;}
}

/* Printable cuenta de cobro template (offscreen, usado para renderizar el PDF final) */
#print-root{position:fixed;left:-9999px;top:0;}
.doc-page{
  width:816px;min-height:1056px;background:#fff;color:#111;padding:70px 66px;
  font-family:'Times New Roman', Georgia, serif;font-size:14px;box-sizing:border-box;
}
.doc-page .doc-fecha{text-align:right;margin-bottom:26px;}
.doc-page .doc-senores{margin-bottom:4px;}
.doc-page .doc-empresa{font-weight:bold;text-transform:uppercase;}
.doc-page .doc-nit{margin-bottom:20px;}
.doc-page .doc-ref{margin-bottom:6px;}
.doc-page .doc-debe{text-align:right;margin-bottom:14px;}
.doc-page .doc-concepto{margin-bottom:22px;line-height:1.5;}
.doc-page table.doc-table{width:100%;border-collapse:collapse;margin-bottom:6px;}
.doc-page table.doc-table th{border:1px solid #111;padding:6px 8px;font-size:12.5px;background:#eee;}
.doc-page table.doc-table td{border:1px solid #111;padding:5px 8px;font-size:12.5px;}
.doc-page .doc-total-row td{font-weight:bold;}
.doc-page .doc-pagar{margin:16px 0 30px;font-style:italic;}
.doc-page .doc-firma-block{margin-top:50px;}
.doc-page .doc-line{border-top:1px solid #111;width:220px;margin-bottom:4px;}

body{
  background:
    radial-gradient(circle at 15% 20%, rgba(242,153,74,0.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(18,40,63,0.18), transparent 45%),
    var(--paper);
}
.quick-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.quick-card{width:100%;max-width:520px;background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.30)}
.quick-body{padding:38px 36px}
.quick-body .platenum{display:inline-block;margin-bottom:14px}
.quick-body h1{font-size:26px;margin:0 0 8px}
.quick-sub{color:var(--ink-soft);font-size:14px;line-height:1.55;margin:0 0 20px}
.found-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px}
.found-name{font-weight:700;font-size:16px}
.found-meta{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;margin-top:4px}
.found-role{display:inline-block;margin-top:8px;background:#dfe6ee;color:var(--navy);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.status{margin-top:14px;font-size:13px}
.status.err{color:var(--danger)}
#success-screen{display:none}
</style>
</head>
<body>

<div id="lookup-screen" class="quick-screen">
  <div class="quick-card">
    <div class="quick-body">
      <span class="platenum">RUTA · CUADRE · COBRO</span>
      <h1>Registro rápido de día laborado</h1>
      <p class="quick-sub">Escanea, escribe tu cédula y registra tu día en segundos.</p>

      <div class="field">
        <label>Número de cédula</label>
        <input id="quick-cedula" inputmode="numeric" autocomplete="off"
               placeholder="Ej. 1082345678"
               onkeydown="if(event.key==='Enter') QuickRegistro.buscar();">
      </div>
      <button class="btn btn-primary btn-block" onclick="QuickRegistro.buscar()">Buscar mis datos</button>
      <div id="quick-status" class="status"></div>

      <div id="quick-found" class="found-card hidden">
        <div class="small-note">Usuario encontrado</div>
        <div id="quick-name" class="found-name"></div>
        <div id="quick-cc" class="found-meta"></div>
        <span id="quick-role" class="found-role"></span>
        <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="QuickRegistro.abrirFormulario()">Registrar día laborado</button>
        <div style="text-align:center;margin-top:10px">
          <button class="link-btn" onclick="QuickRegistro.reset()">No soy yo, buscar otra cédula</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="success-screen" class="quick-screen">
  <div class="quick-card">
    <div class="quick-body" style="text-align:center">
      <span class="platenum">REGISTRO GUARDADO</span>
      <h1>¡Registro guardado!</h1>
      <p class="quick-sub">El día laborado quedó registrado correctamente.</p>
      <button class="btn btn-navy btn-block" onclick="QuickRegistro.reset()">Registrar otro día</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://phomutbqbyxeotidwbyy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob211dGJxYnl4ZW90aWR3Ynl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMzczMTUsImV4cCI6MjEwMzYxMzMxNX0.mnpgXygyDqcay8paXGCoCoLtCeqq8lkzpo7uoq8Kvbg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CARGUE_POBLACIONES = 'CARGUE POBLACIONES';
const CARGUE_POBLACIONES_VALOR = 28000;
const ALMAVIVA_ENTREGA = 'ENTREGA DE PEDIDOS ALMAVIVA';
const ALMAVIVA_ENTREGA_VALOR = 28000;

const TRANSPORTISTA_CONCEPTOS = ['Transporte tipo de pedidos TAT', 'Entregas TAT'];
const TRANSPORTISTA_TIPOS_RUTA = {
  'Zona bananera': 400000,
  'Urbano camioneta': 232000,
  'Urbano furgón': 247000
};

const State = {
  session:null,
  catalogos:{placas:[],conductores:[],tipos_servicio:[],ciudades:[],lugares:[],productos:[]},
  adminConfig:{password:'1234',columnas_reporte:['FECHA','PLACA','ACTIVIDAD','VALOR']},
  registrosCache:[],
  editRegistroId:null,
  productosEstampillado:[]
};

function money(n){n=Number(n)||0;return '$ '+n.toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:0})}
function rand4(){return String(Math.floor(1000+Math.random()*9000))}
function todayISO(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,type){const el=document.createElement('div');el.className='toast-msg'+(type?(' '+type):'');el.textContent=msg;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),4200)}
function openModal(html){document.getElementById('modal-box').innerHTML=`<button class="modal-close" onclick="closeModal()">&times;</button>${html}`;document.getElementById('modal-overlay').classList.add('show')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');document.getElementById('modal-box').innerHTML=''}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});

const Catalogos = {
  async loadAll(){
    const [p,c,t,ci,lg,pr] = await Promise.all([
      sb.from('placas').select('*').order('placa'),
      sb.from('conductores').select('*').order('nombre'),
      sb.from('tipos_servicio').select('*').order('nombre'),
      sb.from('ciudades').select('*').order('nombre'),
      sb.from('lugares_gasto').select('*').order('nombre'),
      sb.from('productos').select('*').order('nombre')
    ]);
    State.catalogos.placas = p.data||[];
    State.catalogos.conductores = c.data||[];
    State.catalogos.tipos_servicio = t.data||[];
    State.catalogos.ciudades = ci.data||[];
    State.catalogos.lugares = lg.data||[];
    State.catalogos.productos = pr.data||[];
    await Catalogos._ensureCarguePoblaciones();
    await Catalogos._ensureLugaresBase();
  },
  async _ensureLugaresBase(){
    const base = ['Zona Bananera','Santa Ana','Río Frío'];
    const faltantes = base.filter(n=>!State.catalogos.lugares.some(l=>(l.nombre||'').trim().toLowerCase()===n.toLowerCase()));
    if(!faltantes.length) return;
    const { error } = await sb.from('lugares_gasto').insert(faltantes.map(nombre=>({nombre})));
    if(!error){

    if(existe) return;
    const { data, error } = await sb.from('tipos_servicio').insert({nombre:'CARGUE POBLACIONES'}).select();
    if(!error && data && data.length){
      State.catalogos.tipos_servicio.push(data[0]);

  async add(table, field, inputId){
    const input = document.getElementById(inputId);
    const value = input.value.trim();
    if(!value){ toast('Escribe un valor','err'); return; }
    const payload = {}; payload[field]=value;
    const { error } = await sb.from(table).insert(payload);
    if(error){ toast('No se pudo agregar (¿ya existe?)','err'); return; }
    input.value='';
    await Catalogos.loadAll();

  async addConductor(){
    const nombre = document.getElementById('new-conductor').value.trim();

    if(!nombre){ toast('Escribe el nombre del conductor','err'); return; }

    if(error){ toast('No se pudo agregar (¿ya existe?)','err'); return; }
    document.getElementById('new-conductor').value='';
    valorEl.value='';
    await Catalogos.loadAll();
    Catalogos.renderAll();
    toast('Conductor agregado','ok');
  },
  async remove(table, id){
    if(!confirm('¿Eliminar este elemento del catálogo?')) return;
    const { error } = await sb.from(table).delete().eq('id', id);
    if(error){ toast('No se pudo eliminar','err'); return; }
    await Catalogos.loadAll();
    Catalogos.renderAll();
  },
  async updateConductorValor(id, valor){
    await sb.from('conductores').update({ valor_dia: Number(valor)||0 }).eq('id', id);
    await Catalogos.loadAll();
    toast('Valor actualizado','ok');
  },
  async cargarProductosExcel(){
    const fileInput = document.getElementById('productos-file');
    const file = fileInput.files[0];
    if(!file){ toast('Selecciona un archivo Excel','err'); return; }
    let rows;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {header:1});
    }catch(e){
      toast('No se pudo leer el archivo','err'); return;
    }
    if(!rows || !rows.length){ toast('El archivo está vacío','err'); return; }
    let startIdx = 0;
    if(rows[0] && rows[0].some(cell => String(cell||'').toUpperCase().includes('NOMBRE') || String(cell||'').toUpperCase().includes('PRODUCTO'))){
      startIdx = 1;
    }
    const nombres = rows.slice(startIdx).map(r => String((r&&r[0])||'').trim()).filter(Boolean);
    if(!nombres.length){ toast('No se encontraron nombres de producto en el archivo','err'); return; }
    const existentes = new Set(State.catalogos.productos.map(p=>(p.nombre||'').trim().toLowerCase()));
    const unicos = [...new Set(nombres.map(n=>n))].filter(n=>!existentes.has(n.trim().toLowerCase()));
    if(!unicos.length){ toast('Todos esos productos ya existían en el catálogo','err'); return; }
    const { error } = await sb.from('productos').insert(unicos.map(nombre=>({nombre})));
    if(error){ toast('No se pudo cargar el listado de productos','err'); return; }
    fileInput.value = '';
    await Catalogos.loadAll();
    Catalogos.renderAll();
    toast(`${unicos.length} producto(s) agregado(s) al catálogo`,'ok');
  },
  renderAll(){
    const mk = (arr, table, withVal) => arr.map(it=>`
      <li>
        <span>
          <span class="cl-name">${esc(it.placa||it.nombre)}</span>
          ${withVal?`<input type="number" value="${it.valor_dia}" class="mono" style="width:90px;margin-left:8px;padding:3px 6px;border:1px solid var(--line-strong);border-radius:5px;" onchange="Catalogos.updateConductorValor('${it.id}', this.value)">`:''}
        </span>
        <button class="btn btn-danger btn-sm" onclick="Catalogos.remove('${table}','${it.id}')">Eliminar</button>
      </li>`).join('') || '<li class="empty-state" style="border:none;">Sin registros</li>';
    document.getElementById('cat-placas').innerHTML = mk(State.catalogos.placas,'placas',false);
    document.getElementById('cat-conductores').innerHTML = mk(State.catalogos.conductores,'conductores',true);
    document.getElementById('cat-servicios').innerHTML = mk(State.catalogos.tipos_servicio,'tipos_servicio',false);
    document.getElementById('cat-ciudades').innerHTML = mk(State.catalogos.ciudades,'ciudades',false);
    document.getElementById('cat-lugares').innerHTML = mk(State.catalogos.lugares,'lugares_gasto',false);
    document.getElementById('cat-productos').innerHTML = mk(State.catalogos.productos,'productos',false);
  }
};

  async _inlineSave(table, field, inputId, selectId){

    Aux._recalcValor();

  _actualizarConductorVisible(){
    const concepto = document.getElementById('rf-concepto').value;
    const esCargue = concepto==='Cargue';
    const tiposervicioEl = document.getElementById('rf-tiposervicio');
    const tipoServicio = tiposervicioEl ? (tiposervicioEl.value||'').trim().toUpperCase() : '';
    const ocultarConductor = esCargue || tipoServicio.includes('ALMAVIVA');
    document.getElementById('conductor-field-wrap').classList.toggle('hidden', ocultarConductor);
  },
  _recalcValor(){
    const concepto = document.getElementById('rf-concepto').value;
    let valor = 0;
    if(concepto==='Estampillado'){
      valor = State.productosEstampillado.reduce((s,p)=> s + (Number(p.cantidad)||0)*30, 0);
    } else if(concepto==='Cargue'){
      valor = CARGUE_POBLACIONES_VALOR;
    } else {
      const tiposervicioEl = document.getElementById('rf-tiposervicio');
      const tipoServicio = tiposervicioEl ? (tiposervicioEl.value||'').trim().toUpperCase() : '';
      if(tipoServicio===CARGUE_POBLACIONES){
        valor = CARGUE_POBLACIONES_VALOR;
      } else if(tipoServicio.includes('ALMAVIVA')){
        valor = ALMAVIVA_ENTREGA_VALOR;
      } else {
        const nombre = document.getElementById('rf-conductor').value;
        if(nombre==='Ninguno' || nombre==='__nuevo__' || !nombre){
          valor = 0;
        } else {
          const found = State.catalogos.conductores.find(c=>c.nombre===nombre);
          valor = found ? Number(found.valor_dia) : 80000;
        }
      }
    }
    document.getElementById('rf-valor').value = valor;

  async saveRegistro(){
    const fecha = document.getElementById('rf-fecha').value;
    const placa = document.getElementById('rf-placa').value;
    const concepto = document.getElementById('rf-concepto').value;
    const ciudad = document.getElementById('rf-ciudad').value;
    const esEstampillado = concepto==='Estampillado';
    const esCargue = concepto==='Cargue';

    let conductor = 'Ninguno', tipo_servicio = '-';
    if(!esEstampillado){
      tipo_servicio = document.getElementById('rf-tiposervicio').value;
      conductor = esCargue ? 'Ninguno' : document.getElementById('rf-conductor').value;
    }

    if([placa,ciudad].includes('__nuevo__') || (!esEstampillado && tipo_servicio==='__nuevo__') || (!esEstampillado && !esCargue && conductor==='__nuevo__')){
      toast('Guarda las opciones nuevas antes de continuar','err'); return;
    }
    if(!fecha || !placa || !ciudad){ toast('Completa todos los campos','err'); return; }
    if(!esEstampillado && !tipo_servicio){ toast('Completa el tipo de ruta','err'); return; }
    if(!esEstampillado && !esCargue && !conductor){ toast('Completa el conductor','err'); return; }

    let productos = [];
    if(esEstampillado){
      productos = State.productosEstampillado.filter(p=>p.referencia && Number(p.cantidad)>0);
      if(!productos.length){ toast('Agrega al menos un producto estampillado con cantidad','err'); return; }
    }

    const valor = Number(document.getElementById('rf-valor').value)||0;

    let actividad;
    if(esEstampillado){
      actividad = 'Estampillado (' + productos.map(p=>`${p.referencia} x${p.cantidad}`).join(', ') + `) - ${ciudad}`;
    } else {
      actividad = `${tipo_servicio} - ${ciudad}`;
    }

    const payload = { auxiliar_id: State.session.auxiliar.id, fecha, placa, conductor, valor, tipo_servicio, concepto, productos, ciudad, actividad, firma:'', es_descuento:false, creado_por:'auxiliar' };

    let error;
    if(State.editRegistroId){
      ({ error } = await sb.from('registros').update(payload).eq('id', State.editRegistroId));
    } else {
      ({ error } = await sb.from('registros').insert(payload));
    }
    if(error){ toast('No se pudo guardar el registro','err'); return; }
    closeModal();
    if(State.session && State.session.tipo==='quick'){
      QuickRegistro.onSaved();
    } else {
      Aux.renderDias();
    }
    toast('Registro guardado','ok');
  },

      <div class="grid2">
        <div class="field"><label>Fecha</label><input type="date" id="rf-fecha" value="${editing?editing.fecha:todayISO()}"></div>
        <div class="field"><label>Placa</label>
          <select id="rf-placa" onchange="Aux._maybeInlineAdd('placa')">${opts(State.catalogos.placas.map(p=>p.placa), editing?editing.placa:null)}</select>
          <div class="inline-add hidden" id="add-placa-wrap"><input id="add-placa-input" placeholder="Nueva placa"><button class="btn btn-navy btn-sm" onclick="Aux._inlineSave('placas','placa','add-placa-input','rf-placa')">Guardar</button></div>
        </div>
      </div>
      <div class="field"><label>Ruta o estampillado</label>
        <select id="rf-concepto-t">
          ${TRANSPORTISTA_CONCEPTOS.map(c=>`<option value="${esc(c)}" ${conceptoActual===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Tipo de ruta</label>
        <select id="rf-tiporuta-t" onchange="Aux._recalcValorTransportista()">
          <option value="">Selecciona…</option>
          ${Object.keys(TRANSPORTISTA_TIPOS_RUTA).map(t=>`<option value="${esc(t)}" ${rutaActual===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-top:14px;"><label>Valor del día</label><input id="rf-valor" class="mono" value="${editing?editing.valor:0}" disabled></div>
      <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="Aux._saveRegistroTransportista()">Guardar registro</button>
    `);
    setTimeout(()=>{ Aux._recalcValorTransportista(); }, 30);
  },
  _recalcValorTransportista(){
    const sel = document.getElementById('rf-tiporuta-t');
    const tipoRuta = sel ? sel.value : '';
    const valor = TRANSPORTISTA_TIPOS_RUTA[tipoRuta] || 0;
    document.getElementById('rf-valor').value = valor;
  },
  async _saveRegistroTransportista(){
    const fecha = document.getElementById('rf-fecha').value;
    const placa = document.getElementById('rf-placa').value;
    const concepto = document.getElementById('rf-concepto-t').value;
    const tipo_servicio = document.getElementById('rf-tiporuta-t').value;
    const valor = Number(document.getElementById('rf-valor').value)||0;

    if(placa==='__nuevo__'){ toast('Guarda la placa nueva antes de continuar','err'); return; }
    if(!fecha || !placa){ toast('Completa la fecha y la placa','err'); return; }
    if(!tipo_servicio){ toast('Selecciona el tipo de ruta','err'); return; }

    const actividad = `${concepto} - ${tipo_servicio}`;
    const payload = { auxiliar_id: State.session.auxiliar.id, fecha, placa, conductor:'', valor, tipo_servicio, concepto, productos:[], ciudad:'', actividad, firma:'', es_descuento:false, creado_por:'auxiliar' };

    let error;
    if(State.editRegistroId){
      ({ error } = await sb.from('registros').update(payload).eq('id', State.editRegistroId));
    } else {
      ({ error } = await sb.from('registros').insert(payload));
    }
    if(error){ toast('No se pudo guardar el registro','err'); return; }
    closeModal();
    if(State.session && State.session.tipo==='quick'){
      QuickRegistro.onSaved();
    } else {
      Aux.renderDias();
    }
    toast('Registro guardado','ok');
  }
};



const QuickRegistro = {
  persona:null,

  async buscar(){
    const cedula=document.getElementById('quick-cedula').value.trim();
    const status=document.getElementById('quick-status');
    if(!cedula){status.textContent='Ingresa tu número de cédula.';status.className='status err';return;}
    status.textContent='Consultando…';status.className='status';

    // MISMA TABLA Y CAMPO DEL INDEX ORIGINAL:
    // auxiliares.cedula + auxiliares.tipo_usuario.
    const {data,error}=await sb.from('auxiliares').select('*').eq('cedula',cedula).maybeSingle();

    if(error||!data){
      status.textContent='No se encontró esa cédula en la base de datos original.';
      status.className='status err';
      document.getElementById('quick-found').classList.add('hidden');
      return;
    }

    QuickRegistro.persona=data;
    State.session={tipo:'quick',auxiliar:data};

    document.getElementById('quick-name').textContent=data.nombre_completo||'Usuario encontrado';
    document.getElementById('quick-cc').textContent='CC '+data.cedula;
    document.getElementById('quick-role').textContent=data.tipo_usuario==='transportista'?'Transportista':'Auxiliar';
    document.getElementById('quick-found').classList.remove('hidden');
    status.textContent='';status.className='status';
  },

  abrirFormulario(){
    if(!QuickRegistro.persona)return;
    // Aux.openRegistroForm() es el mismo método extraído del index:
    // detecta tipo_usuario=transportista y abre el formulario reducido;
    // en cualquier otro caso abre el formulario completo de auxiliar.
    Aux.openRegistroForm();
  },

  onSaved(){
    closeModal();
    document.getElementById('lookup-screen').style.display='none';
    document.getElementById('success-screen').style.display='flex';
  },

  reset(){
    closeModal();QuickRegistro.persona=null;State.session=null;
    document.getElementById('quick-cedula').value='';
    document.getElementById('quick-found').classList.add('hidden');
    document.getElementById('quick-status').textContent='';
    document.getElementById('quick-status').className='status';
    document.getElementById('success-screen').style.display='none';
    document.getElementById('lookup-screen').style.display='flex';
    setTimeout(()=>document.getElementById('quick-cedula').focus(),30);
  }
};

document.getElementById('quick-cedula').focus();
Catalogos.loadAll();
</script>
</body>
</html>
